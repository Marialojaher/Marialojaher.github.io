<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jasmin & The Black Cat — Interactive Story</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #06030f;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
      font-family: 'Crimson Pro', Georgia, serif;
    }

    #story-root {
      width: 100%;
      max-width: 680px;
      min-height: 560px;
      background: #0a0612;
      border-radius: 16px;
      border: 0.5px solid #3a1f6030;
      position: relative;
      overflow: hidden;
      color: #e8dff5;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 30% 8%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 20%, rgba(255,255,255,0.65) 0%, transparent 100%),
        radial-gradient(1px 1px at 75% 10%, rgba(255,255,255,0.45) 0%, transparent 100%);
    }

    .moon {
      position: absolute;
      top: 22px;
      right: 60px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #fff9e0;
      box-shadow: 0 0 18px 6px #fff3a0;
      z-index: 1;
    }

    .scene-art {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 130px;
      z-index: 1;
    }

    .darkness-overlay {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 3s ease;
    }

    .darkness-overlay.active {
      opacity: 1;
    }

    .content-area {
      position: relative;
      z-index: 10;
      padding: 32px 36px 24px;
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }

    .progress-dots {
      display: flex;
      gap: 7px;
      margin-bottom: 18px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(74, 46, 112, 0.35);
    }

    .dot.active {
      background: #9b6fcf;
    }

    .dot.done {
      background: rgba(90, 62, 128, 0.45);
    }

    .chapter-tag {
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px;
      letter-spacing: 3.5px;
      color: #a78fcf;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .story-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 20px;
      color: #e8d5ff;
      line-height: 1.35;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cat-icon {
      font-size: 22px;
    }

    .divider {
      width: 64px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #9b6fcf80, transparent);
      margin: 16px 0;
    }

    .ending-badge {
      display: inline-block;
      font-family: 'Cinzel Decorative', serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .ending-badge.good {
      background: rgba(30,90,60,0.32);
      color: #7de8aa;
    }

    .ending-badge.warn {
      background: rgba(130,90,10,0.32);
      color: #e8c87d;
    }

    .ending-badge.dark {
      background: rgba(100,20,30,0.32);
      color: #e87d88;
    }

    .story-text {
      font-size: 17px;
      line-height: 1.82;
      color: #d8cbf0;
      font-weight: 300;
      flex: 1;
      padding-bottom: 16px;
    }

    .choices-area {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .choice-btn {
      background: rgba(90, 50, 140, 0.16);
      border: 0.5px solid rgba(122, 77, 184, 0.5);
      color: #d4bbf5;
      font-family: 'Crimson Pro', serif;
      font-size: 16px;
      padding: 13px 20px;
      border-radius: 7px;
      cursor: pointer;
      text-align: left;
    }

    .choice-btn:hover {
      background: rgba(130, 70, 200, 0.3);
    }

    .choice-btn.green {
      background: rgba(30, 90, 60, 0.2);
      color: #a8e6c4;
    }

    .choice-btn.red {
      background: rgba(100, 20, 30, 0.2);
      color: #f0a0a8;
    }

    .restart-btn {
      margin-top: 18px;
      background: transparent;
      border: 0.5px solid rgba(122, 77, 184, 0.45);
      color: #9b79cf;
      font-family: 'Cinzel Decorative', serif;
      font-size: 10px;
      letter-spacing: 2px;
      padding: 10px 24px;
      border-radius: 5px;
      cursor: pointer;
    }

    .fade-in {
      animation: fadeInScene 0.7s ease forwards;
    }

    @keyframes fadeInScene {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

<div id="story-root">

  <div class="stars"></div>
  <div class="moon"></div>

  <svg class="scene-art" viewBox="0 0 680 130">
    <path d="M0 90 Q80 60 160 80 Q240 100 320 70 Q400 40 480 75 Q560 105 640 80 L680 85 L680 130 L0 130 Z" fill="#130920"/>
  </svg>

  <div class="darkness-overlay" id="darkOverlay"></div>

  <div class="content-area" id="storyContent"></div>

</div>

<script>

const scenes = {

intro: {
chapter: "Chapter One",
title: "The Night Walk",
dots: 1,
totalDots: 4,

text: `The streetlights cast long shadows as Jasmin walked home from school, her bag filled with skincare products she used every single day.

Suddenly, from a dark alley, a pair of glowing green eyes appeared.

A black cat slowly stepped into the light and stared directly at her.

Then it spoke.

"Too many products will ruin your skin."

Jasmin froze.`,

choices: [
{ label: "Step closer and listen...", next: "catSpeaks", style: "" }
]
},

catSpeaks: {
chapter: "The Warning",
title: "The Black Cat",
dots: 2,
totalDots: 4,

text: `"You use too many chemicals," the cat warned quietly.

"If you continue, your skin will get worse."

The cat looked at the food inside Jasmin's bag.

"You can still change things," it said softly.

Jasmin had to decide what to do.`,

choices: [
{ label: "Listen and feed the cat 🌸", next: "goodEnding", style: "green" },
{ label: "Ignore the cat ⚠️", next: "wakeUp", style: "red" }
]
},

goodEnding: {
chapter: "Ending I",
title: "The Glow",
ending: "good",
endingLabel: "✦ GOOD ENDING",
dots: 4,
totalDots: 4,

text: `Jasmin took some food from her bag and gently placed it in front of the cat.

The cat looked at her calmly before disappearing into the night.

After that, Jasmin simplified her skincare routine and stopped overusing products.

Over time, her skin became healthy, calm, and naturally glowing.

Sometimes, during quiet nights, she still wondered if the black cat had been real at all.`,

choices: []
},

wakeUp: {
chapter: "Chapter Two",
title: "Morning Horror",
dots: 3,
totalDots: 4,

text: `Jasmin ignored the warning and continued using product after product before going to sleep.

The next morning, she looked in the mirror and gasped.

A huge painful pimple had appeared on her face overnight.

No matter what product she used, nothing helped.

Then, she rememered the cat's warning and go out lookinf for the cat.`,

choices: [
{ label: "Find the cat and apologize 🐈", next: "redeemEnding", style: "green" },
{ label: "Use even more products ☠️", next: "darkEnding", style: "red" }
]
},

redeemEnding: {
chapter: "Ending II",
title: "The Apology",
ending: "warn",
endingLabel: "✦ HEALING ENDING",
dots: 4,
totalDots: 4,

text: `Jasmin found the black cat sitting quietly near the alley.

She apologized and promised to take better care of herself.

Slowly, she simplified her routine and stopped damaging her skin with too many products.

It took time, but eventually her skin healed naturally.

From that day on, Jasmin understood that sometimes less is better.`,

choices: []
},

darkEnding: {
chapter: "Ending III",
title: "The Darkness",
ending: "dark",
endingLabel: "✦ DARK ENDING",
dots: 4,
totalDots: 4,

text: `Jasmin continued adding more and more skincare products every day.

Her skin became worse and worse.

Soon, she stopped leaving her room and spent hours staring into the mirror surrounded by bottles and creams.

Outside, somewhere in the darkness, the black cat quietly walked away.

Everything slowly faded into black.`,

choices: []
}

};

function renderScene(key) {

const scene = scenes[key];

const el = document.getElementById('storyContent');

el.innerHTML = '';

const div = document.createElement('div');

div.className = 'fade-in';

let dotsHtml = '<div class="progress-dots">';

for (let i = 1; i <= scene.totalDots; i++) {

const cls = i < scene.dots ? 'done' : i === scene.dots ? 'active' : '';

dotsHtml += `<div class="dot ${cls}"></div>`;

}

dotsHtml += '</div>';

const badge = scene.endingLabel
? `<div class="ending-badge ${scene.ending}">${scene.endingLabel}</div><br>`
: '';

const choices = scene.choices.length > 0

? `<div class="choices-area">${scene.choices.map(c =>

`<button class="choice-btn ${c.style}" data-next="${c.next}">${c.label}</button>`

).join('')}</div>`

: `<div class="choices-area">
<button class="restart-btn" data-next="intro">
↩ Begin Again
</button>
</div>`;

div.innerHTML = `
${dotsHtml}

<div class="chapter-tag">${scene.chapter}</div>

<div class="story-title">
<span class="cat-icon">🐈‍⬛</span>
${scene.title}
</div>

<div class="divider"></div>

${badge}

<div class="story-text">
${scene.text}
</div>

${choices}
`;

el.appendChild(div);

el.querySelectorAll('[data-next]').forEach(btn => {

btn.addEventListener('click', () => {

renderScene(btn.dataset.next);

});

});

}

renderScene('intro');

</script>

</body>
</html>
